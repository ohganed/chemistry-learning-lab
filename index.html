<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174f4a"><meta name="description" content="高校化学から大学化学へつながる、AIなしでも学べる化学教科書">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Chemistry Structure Lab | 化学を構造から学ぶ</title>
<style>
:root{--ink:#173f3a;--muted:#617873;--bg:#f5f8f5;--card:#fff;--accent:#176d61;--line:#dbe6e1;--pale:#eaf3ef}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:#243b37;line-height:1.75}button{font:inherit;cursor:pointer}a{color:inherit}header{padding:22px clamp(18px,5vw,64px);background:#174f4a;color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}header h1{font-size:clamp(19px,2.6vw,30px);margin:0;line-height:1.3}header small{display:block;opacity:.8;font-size:12px;letter-spacing:.08em}header .atom{font-size:36px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1350px;margin:auto;min-height:calc(100vh - 100px)}aside{padding:24px 14px;border-right:1px solid var(--line)}aside h2{color:var(--muted);font-size:12px;letter-spacing:.14em;margin:10px 12px 15px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:12px;color:var(--ink)}nav button:hover,nav button[aria-current="page"]{background:#dfeee7;font-weight:700}main{padding:clamp(20px,4vw,50px);min-width:0}h2{color:var(--ink);line-height:1.4}h3{color:var(--ink)}.eyebrow{color:var(--accent);letter-spacing:.14em;font-size:12px;font-weight:800}.intro{font-size:clamp(16px,1.9vw,20px);max-width:780px;color:#506964}.card{border:1px solid var(--line);background:var(--card);border-radius:19px;padding:clamp(18px,3vw,30px);box-shadow:0 10px 30px #174f4a08;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.topic{border:1px solid var(--line);border-radius:15px;padding:20px;background:#fff;cursor:pointer;text-align:left}.topic:hover{border-color:#74aaa0;background:#f6fbf8}.topic strong{display:block;color:var(--ink);font-size:18px}.topic span{display:block;color:var(--muted);font-size:13px}.tag{display:inline-block;background:var(--pale);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}.formula{font-family:Georgia,serif;font-size:clamp(22px,3.7vw,33px);color:var(--ink);background:#eef5f1;border-radius:14px;text-align:center;padding:20px;margin:18px 0}.steps{border-left:3px solid #b2d3c8;padding-left:24px;margin-left:9px}.step{position:relative;margin:20px 0}.step:before{content:"";position:absolute;left:-32px;top:8px;background:#176d61;border:4px solid #e8f1ec;border-radius:50%;width:13px;height:13px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.primary,.secondary{border:0;border-radius:12px;padding:11px 18px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:var(--pale);color:var(--ink)}.options{display:grid;gap:10px;margin:16px 0}.option{border:1px solid var(--line);border-radius:11px;background:white;text-align:left;padding:13px}.option:hover{background:#eef6f1}.feedback{padding:14px;border-radius:10px;background:#e8f3ed}.note{color:var(--muted);font-size:13px}.hidden{display:none}.orbital{display:flex;justify-content:center;align-items:center;min-height:185px}.nucleus{width:54px;height:54px;border-radius:50%;background:#e4a48a;display:grid;place-items:center;color:#60382f;font-weight:800;position:relative}.orbit{position:absolute;width:180px;height:100px;border:2px solid #74ada1;border-radius:50%;transform:rotate(-30deg);pointer-events:none}.orbit.two{transform:rotate(30deg)}.dot{width:14px;height:14px;border-radius:50%;background:#248bba;position:absolute;top:-7px;left:50%}footer{color:var(--muted);padding:25px;text-align:center;font-size:12px}@media(max-width:740px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:9px 10px}aside h2{margin:8px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto;flex:none}main{padding:20px 16px}header{padding:17px}header .atom{font-size:26px}}
</style>
</head>
<body>
<header><div><small>FROM HIGH SCHOOL TO UNIVERSITY CHEMISTRY</small><h1>Chemistry Structure Lab</h1><small>化学を構造から学ぶ研究室</small></div><div class="atom" aria-hidden="true">⚛</div></header>
<div class="layout"><aside><h2>LEARNING SPACE</h2><nav id="nav" aria-label="学習メニュー">
<button data-page="home" aria-current="page">⌂ ホーム</button>
<button data-page="matter">◉ 物質と粒子</button>
<button data-page="bond">◇ 化学結合</button>
<button data-page="amount">∑ 物質量と計算</button>
<button data-page="reaction">⇄ 化学反応と量</button>
<button data-page="map">▦ 全分野マップ</button><a href="./periodic-table.html" style="display:block;padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:700;background:#e5f2ed;margin-top:6px">▦ 探索型周期表 NEW</a>
<a href="./electron-configuration.html" style="display:block;padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:700;background:#e5f2ed;margin-top:6px">◉ 電子配置を組み立てる NEW</a>
<button data-page="progress">◷ 学習記録</button>
</nav></aside><main id="main" tabindex="-1"></main></div>
<footer>v0.1 — AIがなくても学べる、拡張可能な化学教科書。学習記録はこの端末に保存されます。</footer>
<script>
"use strict";
const pages={
home:{title:"化学の世界へ",sub:"物質を、粒子・結合・エネルギー・反応という関係から理解する。",body:`<div class="card"><span class="tag">学習の考え方</span><h2>暗記から、構造の理解へ。</h2><p>水がなぜ液体なのか。塩がなぜ水に溶けるのか。現象から始め、粒子の構造を考え、説明できるところまで進みます。</p><div class="orbital" aria-label="原子のイメージを表す模式図"><div class="orbit"><div class="dot"></div></div><div class="orbit two"></div><div class="nucleus">原子核</div></div><p class="note">※これは概念的な模式図です。電子の実際の運動を円軌道として表すものではありません。</p></div><h2>学び始める</h2><div class="cards">${["matter","bond","amount","reaction"].map(k=>topic(k)).join("")}</div>`},
matter:{title:"物質と粒子",sub:"目に見える物質を、原子・分子・イオンという構成粒子で考える。",body:`<div class="card"><span class="tag">高校化学基礎 → 大学への入口</span><h2>第1講：原子は何でできているか</h2><p>原子は正の電荷をもつ原子核と、その周囲に分布する負の電荷をもつ電子から構成されます。原子核には陽子と中性子があります（ただし、最も一般的な水素の原子核は陽子1個です）。</p><div class="formula">質量数 = 陽子数 + 中性子数</div><div class="steps"><div class="step"><strong>原子番号</strong><p>原子核の陽子数。元素の種類を決定します。</p></div><div class="step"><strong>同位体</strong><p>陽子数は同じですが、中性子数の異なる原子です。</p></div><div class="step"><strong>大学への接続</strong><p>電子は単純な惑星軌道を回るのではありません。大学化学では電子の状態を量子力学と原子軌道によって記述します。</p></div></div></div>`},
bond:{title:"化学結合",sub:"原子が集まると、なぜ新しい性質が生じるのか。",body:`<div class="card"><span class="tag">高校 → 大学基礎</span><h2>第1講：結合を何が支えるか</h2><p>結合は単なる「線」ではなく、原子核と電子の間の電気的な相互作用、そして電子状態に由来します。</p><div class="steps"><div class="step"><strong>イオン結合</strong><p>陽イオンと陰イオンの静電気的な引力が結晶を支えます。</p></div><div class="step"><strong>共有結合</strong><p>原子間で電子が共有されることで、原子同士が結びつきます。</p></div><div class="step"><strong>大学への接続</strong><p>ルイス構造から原子価結合法・分子軌道法へ進み、結合の強さや分子の形をより定量的に説明します。</p></div></div></div>`},
amount:{title:"物質量と計算",sub:"目に見えない粒子の数を、測定できる質量につなぐ。",body:`<div class="card"><span class="tag">考え方 → 関係式 → 代入</span><h2>第1講：1 molは何を意味する？</h2><p>1 molは、指定した粒子を正確に 6.02214076 × 10²³ 個含む物質量です。質量そのものの単位ではありません。</p><div class="formula">n = m / M</div><p>n：物質量（mol）／m：質量（g）／M：モル質量（g/mol）</p><div class="steps"><div class="step"><strong>考え方</strong><p>「何個あるか」を物質量で表し、1 molあたりの質量を使って実測質量へ変換します。</p></div><div class="step"><strong>例題</strong><p>モル質量18 g/molの水が36 gあるとき、物質量は 36 ÷ 18 = 2 mol です。</p></div></div></div>`},
reaction:{title:"化学反応と量",sub:"反応式を粒子の対応関係として読み解く。",body:`<div class="card"><span class="tag">粒子の保存</span><h2>第1講：反応式の係数</h2><p>化学反応では原子が組み替わります。通常の化学反応では各元素の原子数が反応前後で保存されます。</p><div class="formula">2H₂ + O₂ → 2H₂O</div><p>この係数は、水素分子2個と酸素分子1個から水分子2個ができる粒子数の比を表します。同時に、物質量の比 2 : 1 : 2 も表します。</p><p class="note">※質量保存は原子数の保存と結びつきますが、質量とエネルギーの厳密な関係はさらに深い物理学につながります。</p></div>`},
map:{title:"化学の全分野",sub:"高校化学は、大学化学へ続く体系の入口。",body:`<div class="cards">${["物質の構造と周期性","化学結合と分子構造","物質量・溶液・気体","化学熱力学","反応速度論","化学平衡","酸と塩基","酸化還元・電気化学","無機化学・錯体","有機化学・反応機構","分析化学・分光学","量子化学","統計熱力学","高分子・材料化学","生化学","環境・土壌・農芸化学"].map((s,i)=>`<div class="topic"><span>領域 ${String(i+1).padStart(2,"0")}</span><strong>${s}</strong><span>${i<3?"基礎教材の整備を開始":"今後、段階的に教材を追加"}</span></div>`).join("")}</div>`},
progress:{title:"学習記録",sub:"この端末に保存される学習履歴。",body:""}
};
const quiz={matter:{q:"原子番号を決めるものは？",options:["電子と中性子の合計","原子核の陽子数","陽子と中性子の合計"],correct:1,why:"原子番号は陽子数です。陽子数と中性子数の合計は質量数です。"},bond:{q:"塩化ナトリウムの結晶を支える主な結合は？",options:["イオン結合","金属結合","分子間の水素結合"],correct:0,why:"Na⁺とCl⁻の静電気的な引力がイオン結晶を形成します。"},amount:{q:"モル質量18 g/molの水36 gは何mol？",options:["0.5 mol","2 mol","18 mol"],correct:1,why:"n = m/M = 36/18 = 2 mol です。"},reaction:{q:"2H₂ + O₂ → 2H₂O で、H₂ 4 molに必要なO₂は？",options:["1 mol","2 mol","4 mol"],correct:1,why:"係数比 H₂:O₂ = 2:1 より、4 mol:2 mol です。"}};
const key="chemistry-structure-lab-v01";
function records(){try{return JSON.parse(localStorage.getItem(key))||{}}catch{return {}}}
function save(k,ok){const r=records();r[k]={attempts:(r[k]?.attempts||0)+1,correct:(r[k]?.correct||0)+(ok?1:0),last:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(r))}catch{}}
function topic(k){return `<button class="topic" data-go="${k}"><strong>${pages[k].title}</strong><span>${pages[k].sub}</span></button>`}
function render(k){if(!pages[k])k="home";document.querySelectorAll("nav button").forEach(b=>{b.removeAttribute("aria-current");if(b.dataset.page===k)b.setAttribute("aria-current","page")});const p=pages[k];let body=p.body;if(k==="progress"){const r=records();body='<div class="card"><h2>確認問題の記録</h2>'+Object.keys(quiz).map(s=>`<p><strong>${pages[s].title}</strong>：${r[s]?.attempts||0} 回回答、${r[s]?.correct||0} 回正解</p>`).join("")+'<p class="note">端末を変更すると記録は引き継がれません。将来の版でエクスポートに対応します。</p></div>'}if(quiz[k]){const q=quiz[k];body+=`<section class="card" aria-label="確認問題"><span class="tag">確認問題</span><h2>${q.q}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-answer="${i}">${i+1}. ${o}</button>`).join("")}</div><div id="feedback" role="status" aria-live="polite"></div></section>`}document.getElementById("main").innerHTML=`<span class="eyebrow">CHEMISTRY STRUCTURE LAB</span><h2>${p.title}</h2><p class="intro">${p.sub}</p>${body}<div class="actions"><button class="secondary" data-go="home">⌂ ホームに戻る</button><button class="secondary" data-go="map">全分野マップ</button></div>`;document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.go)));document.querySelectorAll("[data-answer]").forEach(b=>b.addEventListener("click",()=>{const q=quiz[k],ok=Number(b.dataset.answer)===q.correct;save(k,ok);document.getElementById("feedback").innerHTML=`<div class="feedback"><strong>${ok?"正解です！":"もう一度考えてみましょう。"}</strong><p>${q.why}</p></div>`;document.querySelectorAll("[data-answer]").forEach(x=>x.disabled=true)}))}
function navigate(k){location.hash=k}
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));render(location.hash.slice(1)||"home");
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
