const DATA=[{"id":"bonding","ja":"化学結合と分子構造","en":"Chemical Bonding & Molecular Structure","introJa":"電子配置から分子の形・極性へ。結合を線の暗記ではなく相互作用として読み直す。","introEn":"From electron configurations to shapes and polarity: revisit bonding as interactions rather than lines.","nodes":[["valence","0-2","価電子","Valence electrons","最外殻などの結合に関与する電子。典型元素の結合傾向を理解する入口。","Electrons involved in bonding, often in the outer shell for main-group atoms.","元素が異なれば価電子のふるまいも必ず全く異なるか。","Do different elements always have entirely different valence behavior?"],["electronegativity","0-3","電気陰性度","Electronegativity","原子が共有結合の電子密度を引き寄せる傾向を表す相対的尺度。","A relative measure of how an atom attracts shared electron density.","結合の極性があれば分子全体も必ず極性をもつか。","Does a polar bond guarantee a polar molecule?"],["ionic","0-3","イオン結合","Ionic bonding","正負のイオン間の静電的相互作用。結晶全体の配置も物性に影響する。","Electrostatic interactions between oppositely charged ions; lattice arrangement affects properties.","NaClは独立した分子が整列しているのだろうか。","Does solid NaCl consist of individual molecules?"],["covalent","0-3","共有結合","Covalent bonding","原子間で電子密度を共有する結合。結合の線は電子密度分布の近似表現。","Bonding involving shared electron density; the line is a simplified representation.","共有結合の線が電子の通り道を示すのだろうか。","Does a bond line represent an electron trajectory?"],["lewis","0-3","ルイス構造","Lewis structure","価電子対と結合を表す有用な記法だが、電子の確率分布をそのまま描いてはいない。","A useful representation of valence electron pairs and bonds, not a literal electron probability map.","共鳴構造が複数ある分子は実際に交互に切り替わるか。","Do resonance structures physically alternate?"],["vsepr","0-4","VSEPRモデル","VSEPR model","中心原子の電子領域の配置から分子形状を近似するモデル。例外や適用範囲がある。","A model approximating molecular shapes from electron-domain arrangements, with limitations.","電子対の数だけで実測結合角は厳密に決まるか。","Does electron-domain counting exactly determine measured bond angles?"],["polarity","0-4","分子の極性","Molecular polarity","結合双極子のベクトル和と分子の形から分子全体の双極子を考える。","Molecular dipoles depend on vector sums of bond dipoles and geometry.","なぜCO₂はC=O結合に極性があるのに分子は無極性か。","Why is CO₂ nonpolar even though C=O bonds are polar?"],["intermolecular","0-4","分子間相互作用","Intermolecular interactions","分散力・双極子相互作用・水素結合など。沸点と溶解性への影響は条件による。","Dispersion, dipole interactions and hydrogen bonding influence boiling and solubility in context.","水素結合は分子内のO–H共有結合と同じものか。","Is a hydrogen bond the same as an O–H covalent bond?"],["orbitals","0-2","分子軌道の視点","Molecular orbital perspective","電子状態を分子全体の軌道として扱い、結合次数や非局在化を説明する大学化学への入口。","Describe electron states across whole molecules to explain bond order and delocalization.","ルイス構造で説明しきれない現象には何があるか。","Which observations are not fully explained by simple Lewis structures?"]],"edges":[["valence","lewis","prerequisite","価電子の数はルイス構造を書くときの出発点。","Valence counts help construct Lewis structures."],["electronegativity","polarity","application","結合双極子の大きさを考える手掛かりになる。","Electronegativity helps estimate bond dipoles."],["lewis","vsepr","application","ルイス構造にある電子領域から立体配置を予測する。","Use electron domains in Lewis structures to predict geometry."],["vsepr","polarity","reinterpret","分子の形を学ぶと、結合の極性と分子の極性を区別できる。","Geometry changes how bond polarity translates into molecular polarity."],["ionic","covalent","contrast","電子密度の分布や結合の極性を連続的に考え、二分法の限界に気づく。","Consider bonding as a continuum rather than a strict binary classification."],["polarity","intermolecular","application","極性分子間には双極子相互作用が働くが、分散力も存在する。","Polar molecules have dipole interactions as well as dispersion."],["lewis","orbitals","reinterpret","線と孤立電子対の図を、量子的な電子状態として読み直す。","Reinterpret bond lines through quantum electronic states."],["covalent","orbitals","reinterpret","共有結合の電子対モデルを分子全体の軌道へ拡張する。","Extend electron-pair language to molecular-wide orbitals."],["intermolecular","ionic","contrast","分子間力とイオン結晶の相互作用は同じ分類ではない。","Distinguish intermolecular forces from ionic lattice interactions."]]},{"id":"acid-base","ja":"酸・塩基と溶液平衡","en":"Acids, Bases & Solution Equilibria","introJa":"酸の定義を出発点に、pH・電離・緩衝液・滴定を一つの考え方でつなぐ。","introEn":"Connect acid definitions, pH, dissociation, buffers and titrations through equilibrium.","nodes":[["bronsted","2-3","ブレンステッドの酸・塩基","Brønsted acids and bases","酸はプロトン供与体、塩基はプロトン受容体。相手との反応で役割が定まる。","Acids donate protons and bases accept them; roles depend on reaction partners.","水はいつでも塩基として働くのだろうか。","Does water always behave as a base?"],["conjugate","2-3","共役酸塩基対","Conjugate acid–base pairs","H⁺を1個受け渡す関係にある酸と塩基の組。","An acid–base pair differing by the transfer of one proton.","弱酸に対応する共役塩基はどんな性質をもつか。","How does the conjugate base relate to acid strength?"],["activity","2-3","活量と濃度","Activity vs concentration","活量は非理想性を考慮した実効的な量。高校では希薄溶液で濃度を近似利用する。","Activity accounts for nonideality; dilute-solution approximations may use concentration.","高濃度でもpH=-log[H⁺]と厳密に書けるだろうか。","Is pH=-log[H⁺] exact even at high concentration?"],["ph","2-3","pH","pH","水素イオンの活量を基準とする対数尺度。濃度を用いる計算は近似条件を明示する。","A logarithmic scale based on hydrogen-ion activity; concentration-based formulas are approximations.","pHが1下がると何が10倍になるのか。","What changes by a factor of ten when pH falls by one?"],["ka","2-3","酸解離定数 Ka","Acid dissociation constant Ka","水中の酸の電離平衡を特徴づける平衡定数。温度など条件を固定して比較する。","An equilibrium constant characterizing acid dissociation in water at specified conditions.","強い酸とKaが大きい酸はどうつながるか。","How does acid strength relate to Ka?"],["common","2-4","共通イオン効果","Common-ion effect","平衡系に共通のイオンを加えると、組成が変化し得る。反応商と平衡定数で説明できる。","Adding a shared ion changes equilibrium composition, explained by Q and K.","酢酸水溶液へ酢酸イオンを加えると電離はどうなるか。","How does added acetate affect acetic acid dissociation?"],["buffer","2-4","緩衝液","Buffer solution","弱酸とその共役塩基の組などが、少量の酸・塩基に対するpH変化を抑える。","A weak acid/conjugate base pair resists pH changes from limited acid/base addition.","緩衝能を超えると何が起こるか。","What happens when buffer capacity is exceeded?"],["titration","2-4","酸塩基滴定","Acid–base titration","反応の量論・平衡・指示薬の変色範囲を併せて考える分析操作。","An analytical method combining stoichiometry, equilibria and indicator ranges.","当量点とpH7はいつでも一致するか。","Is the equivalence-point pH always seven?"],["henderson","2-4","ヘンダーソン–ハッセルバルヒ式","Henderson–Hasselbalch relation","理想希薄溶液など適切な近似条件で、pH≈pKa+log([A⁻]/[HA])。","Under suitable activity approximations, pH≈pKa+log([A⁻]/[HA]).","この式が成り立ちにくくなるのはどんな条件か。","When does this approximation become unreliable?"]],"edges":[["bronsted","conjugate","prerequisite","プロトンの授受により共役な組が現れる。","Proton transfer defines conjugate pairs."],["activity","ph","reinterpret","濃度だけで考えたpHを活量の概念で読み直す。","Reinterpret concentration-based pH through activities."],["conjugate","ka","application","共役酸塩基対が電離平衡を構成する。","Conjugate pairs participate in dissociation equilibrium."],["ka","common","application","Kaを保つように組成が変わると理解できる。","Equilibrium composition responds while Ka remains fixed at a given temperature."],["common","buffer","application","共通イオン効果は緩衝作用の理解に使える。","Common-ion effects help explain buffering."],["conjugate","buffer","prerequisite","弱酸と共役塩基を組み合わせる意義を理解する。","Understand why weak acids are paired with conjugate bases."],["ka","henderson","prerequisite","Kaの対数pKaを使い組成とpHを関係づける。","Use pKa to connect composition with pH."],["henderson","buffer","reinterpret","緩衝作用を単なる暗記事項から定量的な関係として見る。","Reinterpret buffers through a quantitative relation."],["ph","titration","application","滴定曲線の縦軸pHの意味がわかる。","pH is the key axis in titration curves."],["ka","titration","application","弱酸・弱塩基の当量点が必ずpH7とはならない理由を考える。","Acid strength helps explain equivalence-point pH."],["activity","henderson","contrast","濃度比の近似と活量比の厳密式を区別する。","Distinguish concentration approximation from the activity form."]]},{"id":"redox","ja":"酸化還元と電気化学","en":"Redox & Electrochemistry","introJa":"電子移動・酸化数・電位・電池・電気分解を、エネルギーと化学量で再接続する。","introEn":"Reconnect electron transfer, oxidation states, potential, batteries and electrolysis through energy and amount.","nodes":[["electrons","2-5","電子の授受","Electron transfer","酸化は電子を失う、還元は電子を得る。半反応式で電子収支を表現する。","Oxidation loses electrons; reduction gains them. Half-equations track electron balance.","一方の物質だけが酸化される反応はあるか。","Can oxidation occur without a corresponding reduction?"],["oxidation-state","2-5","酸化数","Oxidation state","電子の割り当てに基づく形式的な数。すべての反応を実際の電子移動として描いているわけではない。","Formal electron-accounting numbers, not always literal electron transfers.","共有結合でも酸化数は変わるか。","Can oxidation states change without ionic electron transfer?"],["half","2-5","半反応式","Half-reaction equation","酸化と還元を分け、原子・電荷・電子を保存して反応式を組み立てる。","Separate oxidation and reduction while balancing atoms and charge.","電子数をそろえる必要はなぜあるか。","Why must electron counts match?"],["cell","2-5","ガルバニ電池","Galvanic cell","自発的な酸化還元反応を外部回路の電流に変換する装置。","Uses a spontaneous redox reaction to deliver electrical work.","電子は電解質の中も電子のまま流れるか。","Do electrons move through the electrolyte as electrons?"],["potential","2-5","電極電位","Electrode potential","電極反応の還元傾向を相対的に表す。単独の電極の絶対電位をそのまま測るものではない。","A relative measure of electrode reduction tendency; single-electrode absolute potentials are not directly measured.","標準電極電位だけで反応速度はわかるか。","Does standard electrode potential predict reaction speed?"],["gibbs","2-0","自由エネルギーと起電力","Gibbs energy and cell voltage","可逆な電池でΔrG=-nFEcellという熱力学的関係がある。実際の端子電圧は条件により低下する。","For an ideal reversible cell, ΔrG=-nFEcell; actual terminal voltage can differ.","大きな起電力は必ず速い反応を意味するか。","Does a large voltage imply a fast reaction?"],["nernst","2-5","ネルンスト式","Nernst equation","電極電位と反応商Qの関係を示す。E=E°-(RT/nF)lnQ（適切な反応表記）。","Relates electrode potential to reaction quotient: E=E°-(RT/nF)lnQ.","濃度を変えると起電力が変わるのはなぜか。","Why can changing concentration change cell voltage?"],["electrolysis","2-5","電気分解","Electrolysis","外部の電気エネルギーを使い非自発的な反応を進める。過電圧などの現実的条件が重要。","Uses electrical energy to drive reactions that are not spontaneous under the operating conditions.","電池と電気分解は電極名だけで区別できるか。","Are anode and cathode names enough to distinguish cells?"],["faraday","2-5","ファラデーの法則","Faraday's law of electrolysis","通過電荷Q=Itと電子の物質量Q/Fを結びつけ、析出・生成量を求める。","Relates Q=It to electron amount Q/F to predict electrolytic yields.","電荷を2倍にすると生成量はいつでも正確に2倍か。","Does doubling charge always double actual yield?"]],"edges":[["electrons","half","prerequisite","電子収支が半反応式の係数決定を支える。","Electron accounting supports half-reaction balancing."],["oxidation-state","electrons","contrast","酸化数の変化は形式的な数え方で、実電子移動の図とは限らない。","Formal oxidation-state changes need not depict literal transfer."],["half","cell","application","分離した半反応を電極へ割り振る。","Assign oxidation and reduction half-reactions to electrodes."],["potential","cell","application","電極間の電位差が起電力を考える入口になる。","Electrode potential difference helps explain cell voltage."],["cell","electrolysis","contrast","自発的な反応から電気を取り出すか、電気で反応を駆動するか。","Compare producing electric work with driving reactions electrically."],["gibbs","cell","reinterpret","起電力を単なる観測値でなく自由エネルギー変化と結びつける。","Reinterpret cell voltage through reaction Gibbs energy."],["potential","nernst","reinterpret","標準条件だけでなく反応商に応じて電位が変化する。","Extend standard potentials to nonstandard conditions through Q."],["nernst","gibbs","prerequisite","ネルンスト式は自由エネルギーと反応商の関係から導ける。","Nernst's equation follows from Gibbs energy and Q."],["electrons","faraday","application","電子の量を電荷として測る。","Measure electron amount through charge."],["faraday","electrolysis","application","電気分解の理論的生成量を求める。","Predict theoretical electrolytic production."],["gibbs","electrolysis","contrast","熱力学的に可能かと、必要な実用電圧は同じ問題ではない。","Thermodynamic threshold and practical applied voltage differ."]]}];
const BRIDGES=[["bonding","electronegativity","redox","oxidation-state","contrast","電気陰性度は共有電子密度を引く傾向、酸化数は形式的な電子の割当て。混同せずに考える。","Electronegativity concerns electron-density attraction; oxidation state is formal electron accounting."],["bonding","polarity","acid-base","bronsted","application","結合の極性は酸性を考える手がかりだが、酸の強さは溶媒・安定性・平衡にも依存する。","Bond polarity informs acidity, but acid strength also depends on solvent, stability and equilibrium."],["bonding","intermolecular","acid-base","activity","reinterpret","水素結合やイオン間相互作用を学ぶと、濃度と活量が異なる意味を理解しやすい。","Intermolecular and ionic interactions help explain why activity differs from concentration."],["acid-base","ka","redox","nernst","analogy","Kaもネルンスト式も反応商と熱力学的平衡に結びつく。ただし扱う反応・観測量は異なる。","Both Ka and Nernst relations connect to Q and thermodynamics, though their reactions and observables differ."],["acid-base","titration","redox","half","analogy","酸塩基滴定はプロトンの当量、酸化還元滴定は電子の当量を利用する。","Acid–base titration counts proton equivalents; redox titration counts electron equivalents."],["acid-base","activity","redox","nernst","prerequisite","ネルンスト式のQを正確に書くにはイオンの活量を考える。","Ion activities underlie accurate reaction quotients in the Nernst equation."],["redox","gibbs","acid-base","ka","reinterpret","標準自由エネルギーと平衡定数の関係は酸塩基平衡にも電池反応にも使える。","The relationship between standard Gibbs energy and equilibrium constants applies to acid–base and cell reactions."]];

let lang=q.get("lang")==="en"?"en":"ja", domain=DATA.find(d=>d.id===q.get("domain"))||DATA[0], node=domain.nodes.find(n=>n[0]===q.get("concept"))?.[0]||domain.nodes[0][0], notes=[];
try{let old=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(old))notes=old.filter(n=>n&&DATA.some(d=>d.id===n.domain&&d.nodes.some(v=>v[0]===n.concept))&&typeof n.text==="string").slice(-500)}catch{}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function name(n){return n[lang==="ja"?2:3]}function desc(n){return n[lang==="ja"?4:5]}function explain(e){return e[lang==="ja"?3:4]}function persist(){localStorage.setItem(KEY,JSON.stringify(notes))}
function redraw(){let u=UI[lang],n=domain.nodes.find(x=>x[0]===node);$("chooseConcept").textContent=lang==="ja"?"概念を選ぶ":"Choose concept";$("readConcept").textContent=lang==="ja"?"学ぶ":"Explore";document.documentElement.lang=lang;
$("lang").value=lang;$("heading").textContent=u.heading;$("intro").textContent=domain[lang==="ja"?"introJa":"introEn"];$("freedom").textContent=u.freedom;
$("domain").innerHTML=DATA.map(d=>'<option value="'+esc(d.id)+'">'+esc(d[lang])+'</option>').join("");$("domain").value=domain.id;
$("toChapters").textContent=u.toChapters;$("toChapters").href="./concept-connections.html"+(lang==="en"?"?lang=en":"");
$("toEquilibrium").textContent=u.toEquilibrium;$("toEquilibrium").href="./equilibrium-concept-lab.html"+(lang==="en"?"?lang=en":"");
$("menuHeading").textContent=u.menu;$("chapTitle").textContent=domain[lang];$("conceptTitle").textContent=name(n);$("definition").textContent=desc(n);$("prompt").textContent=u.prompts+n[lang==="ja"?6:7];
$("lessonLink").textContent=u.chap;$("lessonLink").href="./high-school-chemistry"+(lang==="en"?"-en":"")+".html#chapter="+encodeURIComponent(n[1]);
$("connectionsHeading").textContent=u.connections;$("notesHeading").textContent=u.notes;$("notesInfo").textContent=u.notesInfo;$("noteLabel").textContent=u.noteLabel;$("save").textContent=u.save;$("export").textContent=u.export;
$("nodeMenu").innerHTML=domain.nodes.map(v=>'<button class="node '+(v[0]===node?"selected":"")+'" data-node="'+esc(v[0])+'">'+esc(name(v))+'</button>').join("");
let edges=domain.edges.filter(e=>e[0]===node||e[1]===node);$("links").innerHTML=edges.map(e=>{let target=domain.nodes.find(v=>v[0]===(e[0]===node?e[1]:e[0]));return '<div class="pair"><span class="tag">'+esc(u.types[e[2]])+'</span><h3>'+esc(name(target))+'</h3><p>'+esc(explain(e))+'</p><button data-node="'+esc(target[0])+'">'+esc(name(target))+' →</button></div>'}).join("");
let relatedBridges=BRIDGES.filter(e=>(e[0]===domain.id&&e[1]===node)||(e[2]===domain.id&&e[3]===node));
$("links").innerHTML+=relatedBridges.map(e=>{let destination=e[0]===domain.id&&e[1]===node?{domain:e[2],concept:e[3]}:{domain:e[0],concept:e[1]};let targetDomain=DATA.find(d=>d.id===destination.domain),target=targetDomain.nodes.find(n=>n[0]===destination.concept);return '<div class="pair"><span class="tag">'+esc(u.types[e[4]])+' · '+esc(targetDomain[lang])+'</span><h3>'+esc(name(target))+'</h3><p>'+esc(e[lang==="ja"?5:6])+'</p><button data-bridge="'+esc(destination.domain)+'|'+esc(destination.concept)+'">'+esc(name(target))+' →</button></div>'}).join("");
document.querySelectorAll("[data-bridge]").forEach(b=>b.onclick=()=>{let [d,n]=b.dataset.bridge.split("|");domain=DATA.find(x=>x.id===d)||domain;node=n;$("noteText").value="";history.replaceState(null,"",location.pathname+"?"+new URLSearchParams({domain:domain.id,concept:node,lang}).toString());redraw();mobileSwitch("detail",true)});

$("notes").innerHTML=notes.filter(v=>v.domain===domain.id&&v.concept===node).slice().reverse().map(v=>'<div class="memo"><div class="muted">'+esc(v.at.slice(0,10))+'</div><p>'+esc(v.text)+'</p><button class="small" data-delete="'+esc(v.id)+'">'+esc(u.delete)+'</button></div>').join("")||'<p class="muted">'+esc(u.empty)+'</p>';
document.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{node=b.dataset.node;$("noteText").value="";$("status").textContent="";history.replaceState(null,"",location.pathname+"?"+new URLSearchParams({domain:domain.id,concept:node,lang}).toString());redraw();mobileSwitch("detail",true)});
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{notes=notes.filter(v=>v.id!==b.dataset.delete);try{persist();redraw()}catch{$("status").textContent="Storage unavailable."}});
}
$("domain").onchange=()=>{domain=DATA.find(d=>d.id===$("domain").value)||DATA[0];node=domain.nodes[0][0];$("noteText").value="";redraw()};
$("lang").onchange=()=>{lang=$("lang").value;redraw()};
$("save").onclick=()=>{let value=$("noteText").value.trim();if(!value)return;notes.push({id:"i-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),domain:domain.id,concept:node,text:value,at:new Date().toISOString(),provenance:"learner-reflection"});notes=notes.slice(-500);try{persist();$("noteText").value="";redraw();$("status").textContent=UI[lang].saved}catch{$("status").textContent="Storage unavailable."}};
$("export").onclick=()=>{let data={schema:"chemistry-cross-domain-insights",schemaVersion:"1.0",sourceApp:"chemistry-structure-lab",exportedAt:new Date().toISOString(),records:notes};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="chemistry-cross-domain-insights.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$("chooseConcept").onclick=()=>mobileSwitch("list",true);$("readConcept").onclick=()=>mobileSwitch("detail",true);redraw();mobileSwitch("detail");
</script></body></html>
