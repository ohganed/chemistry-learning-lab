<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f4a"><title>Dynamic Equilibrium Experiment | Chemistry Structure Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#263b35;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.75}header{background:#174f4a;color:white;padding:20px clamp(16px,4vw,50px)}header a{color:#d8f1e7}h1{font-size:clamp(23px,4vw,33px);margin:6px 0}main{max-width:1100px;margin:auto;padding:14px 16px 70px}.card{background:white;border:1px solid #d6e6dd;border-radius:17px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.readout>div{background:#edf6ef;padding:11px;border-radius:12px;text-align:center}.readout strong{display:block;color:#174f4a;font-size:clamp(17px,3vw,23px)}input,select,textarea,button{font:inherit}input[type=range]{width:100%}label{font-weight:750;display:block;margin-top:14px}button{border:1px solid #a6caba;background:#e4f1e8;padding:10px 14px;border-radius:10px;color:#174f4a;cursor:pointer;margin:6px 5px 0 0}.pill{background:#e5f1e8;color:#1a6b57;padding:4px 10px;border-radius:15px;font-size:12px}.note{color:#577166;font-size:13px}.prompt{border-left:4px solid #58a388;padding:13px;background:#f0f7f2;border-radius:9px}textarea{width:100%;min-height:80px;border:1px solid #b8d0c2;border-radius:10px;padding:10px}.axis{font-size:12px;fill:#5a786b}svg{max-width:100%;height:auto;overflow:visible}#graph{border:1px solid #e1eae3;border-radius:12px;background:#fff} .links a{display:inline-block;margin:3px 12px 3px 0;color:#166856}@media(max-width:740px){.grid{grid-template-columns:1fr}.readout{grid-template-columns:1fr 1fr 1fr}.card{padding:15px}}</style></head><body>
<header><a href="./index.html">← Chemistry Structure Lab</a><h1 id="title"></h1><p id="subtitle"></p></header>
<main><div class="card"><label for="lang">Language / 言語</label> <select id="lang"><option value="ja">日本語</option><option value="en">English</option></select><p id="model"></p><p class="note" id="limitations"></p><div class="links"><a href="./equilibrium-concept-lab.html" id="conceptLink"></a><a href="./knowledge-atlas.html?concept=chem.hs.2-2.a" id="atlasLink"></a></div></div>
<div class="grid"><section class="card"><h2 id="controlsTitle"></h2><label for="kf" id="kfLabel"></label><input type="range" id="kf" min="0.1" max="2.0" step="0.1" value="0.6"><div id="kfValue"></div>
<label for="kr" id="krLabel"></label><input type="range" id="kr" min="0.1" max="2.0" step="0.1" value="0.3"><div id="krValue"></div>
<label for="initial" id="initialLabel"></label><input type="range" id="initial" min="0" max="100" step="5" value="100"><div id="initialValue"></div>
<label for="catalyst" id="catalystLabel"></label><input type="range" id="catalyst" min="1" max="5" step="1" value="1"><div id="catalystValue"></div>
<label for="time" id="timeLabel"></label><input type="range" id="time" min="0" max="10" step="0.1" value="2"><div id="timeValue"></div><button id="reset"></button></section>
<section class="card"><h2 id="graphTitle"></h2><svg id="graph" viewBox="0 0 640 340" role="img" aria-labelledby="chartDesc"><title id="chartDesc">Concentration versus time</title><line x1="54" y1="280" x2="610" y2="280" stroke="#7c9788"/><line x1="54" y1="24" x2="54" y2="280" stroke="#7c9788"/><text x="56" y="18" class="axis">Concentration</text><text x="540" y="314" class="axis">time →</text><text x="18" y="33" class="axis">1.0</text><text x="20" y="285" class="axis">0.0</text><text x="50" y="298" class="axis">0</text><text x="585" y="298" class="axis">10</text><path id="pathA" stroke="#216d9b" fill="none" stroke-width="3"/><path id="pathB" stroke="#c57440" fill="none" stroke-width="3"/><line id="cursor" x1="54" y1="24" x2="54" y2="280" stroke="#667d72" stroke-dasharray="5 4"/><circle id="dotA" r="6" fill="#216d9b"/><circle id="dotB" r="6" fill="#c57440"/></svg><p><span style="color:#216d9b">● A</span>　<span style="color:#c57440">● B</span></p>
<div class="readout"><div><small id="aLabel"></small><strong id="aValue"></strong></div><div><small id="bLabel"></small><strong id="bValue"></strong></div><div><small id="kLabel"></small><strong id="kValue"></strong></div></div>
<p id="rates"></p><div class="prompt" id="insight"></div></section></div>
<section class="card"><h2 id="thinkTitle"></h2><p id="think"></p><label id="predictionLabel" for="prediction"></label><textarea id="prediction" maxlength="1200"></textarea><button id="store"></button><p id="status" role="status"></p><p class="note" id="thinkingNote"></p></section></main>
<script>
"use strict";
const L={ja:{title:"動的平衡を実験する",subtitle:"『反応が速くなること』と『平衡の位置』は同じだろうか？",model:"モデル：A ⇌ B の単純な可逆一次反応。閉じた系・一定温度・全濃度 A+B=1 を仮定します。正反応速度 = kf[A]、逆反応速度 = kr[B]。",limitations:"教材用の数学モデルです。すべての実際の化学反応に当てはまるものではありません。触媒の効果は両方向の速度定数を同じ倍率にする近似で表現しています。",conceptLink:"化学平衡の概念ラボ",atlasLink:"知識アトラスへ",controls:"条件を変える",kf:"正反応速度定数 kf",kr:"逆反応速度定数 kr",initial:"開始時のAの割合",catalyst:"触媒による速度倍率",time:"観測する時刻",reset:"初期条件に戻す",graph:"時間と濃度の変化",a:"濃度 [A]",b:"濃度 [B]",k:"平衡比 K=[B]/[A]",rates:"その時刻の正逆速度：",insight:"観察：触媒倍率だけを変えてみてください。平衡に到達する速さは変わりますが、同じ温度での平衡比Kは変わりません。",thinkTitle:"考え方の実験",think:"操作する前に予測し、操作後にその予測と比べてみましょう。必ず正答する必要はありません。",prediction:"予測したこと・新しく気づいたこと（任意）",store:"気づきを端末内に保存",saved:"保存しました。",thinkingNote:"このメモは端末内に保存されます。評価点や進行制限はありません。"},en:{title:"Experiment with Dynamic Equilibrium",subtitle:"Does reaching equilibrium faster mean changing its composition?",model:"Model: a simple reversible first-order reaction A ⇌ B in a closed system at constant temperature with total concentration A+B=1. Forward rate=kf[A]; reverse rate=kr[B].",limitations:"This is a mathematical teaching model, not a universal description of chemical reactions. A catalyst is approximated as multiplying both rate constants equally.",conceptLink:"Equilibrium concept lab",atlasLink:"Knowledge Atlas",controls:"Change conditions",kf:"Forward rate constant kf",kr:"Reverse rate constant kr",initial:"Initial fraction A",catalyst:"Catalytic rate multiplier",time:"Observation time",reset:"Reset conditions",graph:"Concentrations over time",a:"Concentration [A]",b:"Concentration [B]",k:"Equilibrium ratio K=[B]/[A]",rates:"Forward and reverse rates at this moment: ",insight:"Try changing only the catalyst multiplier. Equilibrium is reached faster, but the equilibrium ratio K remains unchanged at the same temperature.",thinkTitle:"Experiment with your thinking",think:"Predict first, change a parameter, then revisit your prediction. There is no required correct answer.",prediction:"Your prediction or observation (optional)",store:"Save note on this device",saved:"Saved.",thinkingNote:"Notes stay on this device. There is no grading or mastery gate."}};
const $=id=>document.getElementById(id),key="chemistry-equilibrium-experiment-notes-v1";let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"ja";
function value(id){return Number($(id).value)}function cA(t){let kf=value("kf"),kr=value("kr"),f=value("catalyst"),initial=value("initial")/100;let eq=kr/(kf+kr);return eq+(initial-eq)*Math.exp(-(kf+kr)*f*t)}
function draw(){let t=value("time"),a=cA(t),b=1-a,kf=value("kf")*value("catalyst"),kr=value("kr")*value("catalyst"),x=t=>54+556*t/10,y=c=>280-256*c;const trace=which=>Array.from({length:151},(_,i)=>{let t=i/15,v=which==="a"?cA(t):1-cA(t);return(i?"L":"M")+x(t).toFixed(2)+","+y(v).toFixed(2)}).join(" ");$("pathA").setAttribute("d",trace("a"));$("pathB").setAttribute("d",trace("b"));$("cursor").setAttribute("x1",x(t));$("cursor").setAttribute("x2",x(t));for(const [dot,v]of [["dotA",a],["dotB",b]]){$(dot).setAttribute("cx",x(t));$(dot).setAttribute("cy",y(v))}let eqRatio=value("kf")/value("kr");$("aValue").textContent=a.toFixed(3);$("bValue").textContent=b.toFixed(3);$("kValue").textContent=eqRatio.toFixed(2);$("rates").textContent=L[lang].rates+(kf*a).toFixed(3)+" / "+(kr*b).toFixed(3);for(const id of ["kf","kr","initial","catalyst","time"])$(id+"Value").textContent=value(id)+(id==="initial"?"%":id==="catalyst"?"×":"");}
function render(){let d=L[lang];document.documentElement.lang=lang;$("lang").value=lang;for(const [id,k]of Object.entries({title:"title",subtitle:"subtitle",model:"model",limitations:"limitations",conceptLink:"conceptLink",atlasLink:"atlasLink",controlsTitle:"controls",kfLabel:"kf",krLabel:"kr",initialLabel:"initial",catalystLabel:"catalyst",timeLabel:"time",reset:"reset",graphTitle:"graph",aLabel:"a",bLabel:"b",kLabel:"k",insight:"insight",thinkTitle:"thinkTitle",think:"think",predictionLabel:"prediction",store:"store",thinkingNote:"thinkingNote"}))$(id).textContent=d[k];$("conceptLink").href="./equilibrium-concept-lab.html"+(lang==="en"?"?lang=en":"");$("atlasLink").href="./knowledge-atlas.html"+(lang==="en"?"?lang=en&concept=chem.hs.2-2.a":"?concept=chem.hs.2-2.a");draw()}
for(const id of ["kf","kr","initial","catalyst","time"])$(id).oninput=draw;$("lang").onchange=()=>{lang=$("lang").value;render()};
$("reset").onclick=()=>{for(const [id,v]of Object.entries({kf:0.6,kr:0.3,initial:100,catalyst:1,time:2}))$(id).value=v;draw()};
$("store").onclick=()=>{let note=$("prediction").value.trim();if(!note)return;let data=[];try{data=JSON.parse(localStorage.getItem(key)||"[]")}catch{}if(!Array.isArray(data))data=[];data.push({at:new Date().toISOString(),note,parameters:Object.fromEntries(["kf","kr","initial","catalyst","time"].map(k=>[k,value(k)])),provenance:"learner-observation"});try{localStorage.setItem(key,JSON.stringify(data.slice(-200)));$("status").textContent=L[lang].saved;$("prediction").value=""}catch{$("status").textContent="Storage unavailable."}};
render();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
