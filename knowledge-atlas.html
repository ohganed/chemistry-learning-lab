<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174f4a"><title>Knowledge Atlas | Chemistry Structure Lab</title>
<style>
:root{--green:#176e5c;--deep:#174f4a;--line:#dbe9df;--pale:#eaf5ed;--muted:#61776e}*{box-sizing:border-box}
body{margin:0;color:#2c4038;background:#f5f8f5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.7}
header{padding:20px clamp(16px,4vw,60px);background:var(--deep);color:white}header a{color:#d3efe2}h1{margin:5px 0;font-size:clamp(23px,4vw,35px)}
main{max-width:1280px;margin:auto;padding:15px 14px 70px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:minmax(230px,310px) 1fr;gap:16px}button,select,input,textarea{font:inherit;border:1px solid #b8d1c4;border-radius:11px;padding:10px;background:white;color:#214638}
button{cursor:pointer}button.active{background:#d9efe3;font-weight:750}button.primary{background:var(--green);color:white;border:0;font-weight:750}
button.node{display:block;text-align:left;width:100%;margin:5px 0}button.node small{display:block;color:#718478}label{display:block;font-weight:750;margin:8px 0 5px}
input[type=search],textarea,select.wide{width:100%}textarea{min-height:100px;resize:vertical}
.pill{display:inline-block;border-radius:30px;background:var(--pale);padding:3px 11px;color:#136754;font-size:12px;font-weight:750}
.connection{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:12px}.connection p{margin:7px 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls>*{flex:1;min-width:150px}
.small{color:var(--muted);font-size:13px}.muted{color:var(--muted)}.revisit{background:#f0f8f0;border-left:4px solid #4a9377;padding:14px;border-radius:10px}
#nodes{max-height:610px;overflow:auto}#summary{color:#d2f2e3;font-size:14px}#status{min-height:25px}
.meta{display:flex;flex-wrap:wrap;gap:8px}.meta>*{flex:0 1 auto}
note{display:block}.note{background:#f7faf7;border:1px solid var(--line);padding:12px;border-radius:12px;margin:8px 0}
#detail h2{margin-bottom:0}a{color:#156853}.buttonlink{display:inline-block;padding:9px 12px;border-radius:10px;background:var(--pale);text-decoration:none;margin:6px 7px 3px 0}
@media(max-width:760px){.grid{grid-template-columns:1fr}#nodes{max-height:330px}.card{padding:14px}}
</style></head><body><header><a href="./index.html">← Chemistry Structure Lab</a><h1 id="heading">Knowledge Atlas</h1><p id="subtitle"></p><div id="summary"></div></header>
<main><div class="card controls"><div><label for="language">Language / 言語</label><select id="language" class="wide"><option value="ja">日本語</option><option value="en">English</option></select></div>
<div><label id="filterLabel" for="filter"></label><select id="filter" class="wide"></select></div>
<div><label id="searchLabel" for="search"></label><input id="search" type="search" autocomplete="off"></div></div>
<p id="principle" class="small"></p>
<div class="grid"><aside class="card"><h2 id="menuTitle"></h2><div id="nodes"></div></aside>
<div id="detail"><section class="card"><div class="meta"><span class="pill" id="level"></span><span class="pill" id="context"></span></div><h2 id="name"></h2><p id="description"></p><a id="chapterLink" class="buttonlink" hidden></a><a href="./concept-connections.html" class="buttonlink" id="olderNetwork"></a></section>
<section class="card"><h2 id="connectionsTitle"></h2><div id="connections"></div></section>
<section class="card"><h2 id="pathTitle"></h2><p class="small" id="pathHint"></p><label id="pathTargetLabel" for="pathTarget"></label><select class="wide" id="pathTarget"></select><button class="primary" id="findPath"></button><div id="pathResult" role="status"></div></section>
<section class="card"><h2 id="discoverTitle"></h2><p class="small" id="discoverIntro"></p><label id="targetLabel" for="target"></label><select class="wide" id="target"></select><label id="relationLabel" for="relation"></label><select id="relation" class="wide"></select><label id="reasonLabel" for="reason"></label><textarea id="reason" maxlength="1200"></textarea>
<button class="primary" id="saveConnection"></button><div id="status" role="status"></div></section>
<section class="card"><h2 id="reflectionTitle"></h2><div class="revisit" id="reflectionGuide"></div><label id="reflectionLabel" for="reflection"></label><textarea id="reflection" maxlength="1500"></textarea><button id="saveReflection" class="primary"></button><div id="reflections"></div></section>
<section class="card"><h2 id="backupsTitle"></h2><p class="small" id="backupHint"></p><button id="export" class="primary"></button></section></div></div></main>
<script>
"use strict";
const DATA_URL="./data/chemistry-knowledge-atlas-v1.json",STORAGE="chemistry-atlas-notes-v1", $=id=>document.getElementById(id);
const T={ja:{heading:"化学の知識アトラス",subtitle:"高校29章から大学9分野へ、学び直すたびにつながりが増える",filter:"表示する分野",all:"すべての概念",hs:"高校化学",uni:"大学化学",search:"概念・理由を検索",menu:"概念一覧",principle:"テストの正解・不正解による進行制限はありません。分野を飛び越え、あとから理解を組み替えることを歓迎します。",description:"この概念から別の知識へつながる理由を見てみましょう。",chapter:"高校化学の章を開く",older:"以前の29章ネットワーク",connections:"理由のある知識接続",pathTitle:"概念をつなぐ道を探す",pathHint:"どの概念からどこへつながるか。関連の最短経路を表示します。これは学習の順番を指示するものではありません。",pathTarget:"どの概念までつなぐ？",findPath:"関連の経路を探す",pathEmpty:"現在の登録済みの接続だけでは、経路を見つけられません。",pathSame:"別の概念を選んでください。",discover:"自分で発見した接続を追加",discoverIntro:"ここに記録した関係は学習者の仮説であり、教材側の関係とは区別して表示します。",target:"つながる概念",relation:"どんな関係？",reason:"なぜつながると思う？",save:"自分の接続を保存",saved:"気づきを端末内に保存しました。",need:"異なる概念を選び、理由を記入してください。",delete:"削除",reflect:"以前の理解がどう変わった？",reflectionGuide:"別の分野を学んだあとで戻ってみましょう。前には見えなかった関係・修正した前提・残る疑問など、書きたいときだけ記録できます。",reflectionLabel:"今回の再解釈（任意）",saveReflection:"再解釈を保存",backups:"データの持ち出し",backupHint:"この画面で発見した接続と再解釈をJSONに保存。既存の学習記録は消しません。",export:"JSONを保存",none:"表示する概念がありません。",noLinks:"この概念に登録済みの関係はまだありません。",curated:"教材に登録された関係（初稿）",hypothesis:"学習者の仮説",types:{prerequisite:"前提知識",analogy:"類似",contrast:"対照",application:"応用",reinterpret:"後から再解釈"},loadError:"教材データを読み込めませんでした。接続を確認してください。"},en:{heading:"Chemistry Knowledge Atlas",subtitle:"From 29 high-school chapters to nine university fields: revisit, connect and rethink",filter:"Study area",all:"All concepts",hs:"High school",uni:"University",search:"Search concepts and reasons",menu:"Concepts",principle:"There are no test-based mastery gates. Explore across fields and revise earlier understanding when you learn something new.",description:"Explore how this idea connects with others.",chapter:"Open high-school chapter",older:"Earlier 29-chapter network",connections:"Connections with reasons",pathTitle:"Find a conceptual connection path",pathHint:"Explore a shortest path through recorded relationships. This is not a prescribed study order.",pathTarget:"Destination concept",findPath:"Find a path",pathEmpty:"No path found in the currently recorded connections.",pathSame:"Please choose another concept.",discover:"Add a connection you discovered",discoverIntro:"Your connections are personal hypotheses, shown separately from curriculum links.",target:"Connected concept",relation:"Relationship",reason:"Why do you think they connect?",save:"Save your connection",saved:"Saved on this device.",need:"Choose a different concept and explain your reasoning.",delete:"Delete",reflect:"What changed in your understanding?",reflectionGuide:"Return after learning other topics. Record a revised assumption, newly noticed connection or unanswered question whenever you wish.",reflectionLabel:"New interpretation (optional)",saveReflection:"Save reinterpretation",backups:"Take your data with you",backupHint:"Export your personal links and reflections as JSON. Existing records remain unchanged.",export:"Export JSON",none:"No matching concepts.",noLinks:"No curated connections yet.",curated:"Curriculum link (draft)",hypothesis:"Learner hypothesis",types:{prerequisite:"Prerequisite",analogy:"Analogy",contrast:"Contrast",application:"Application",reinterpret:"Reinterpretation"},loadError:"Unable to load curriculum data. Check your connection."}};
let atlas=null,lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"ja",selected=new URLSearchParams(location.search).get("concept"),notes={connections:[],reflections:[]};
function safe(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||"{}");if(Array.isArray(saved.connections))notes.connections=saved.connections.filter(x=>x&&typeof x.reason==="string").slice(-500);if(Array.isArray(saved.reflections))notes.reflections=saved.reflections.filter(x=>x&&typeof x.text==="string").slice(-500)}catch{}
const find=id=>atlas.nodes.find(n=>n.id===id),nm=n=>n[lang],t=()=>T[lang];
function persist(){localStorage.setItem(STORAGE,JSON.stringify(notes))}
function options(){let old=$("filter").value;$("filter").innerHTML='<option value="all">'+t().all+'</option><option value="high-school">'+t().hs+'</option><option value="university">'+t().uni+'</option>';if(["all","high-school","university"].includes(old))$("filter").value=old}
function nav(){let filter=$("filter").value,query=$("search").value.trim().toLocaleLowerCase(),list=atlas.nodes.filter(n=>(filter==="all"||n.level===filter)&&(!query||[n.ja,n.en,n.contextJa,n.contextEn].some(s=>(s||"").toLocaleLowerCase().includes(query))||atlas.edges.some(e=>(e.from===n.id||e.to===n.id)&&[e.ja,e.en].some(reason=>reason.toLocaleLowerCase().includes(query)))));$("nodes").innerHTML=list.length?list.map(n=>'<button class="node '+(n.id===selected?"active":"")+'" data-pick="'+safe(n.id)+'">'+safe(nm(n))+'<small>'+safe(n[lang==="ja"?"contextJa":"contextEn"])+'</small></button>').join(""):'<p>'+safe(t().none)+'</p>';document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>selectNode(b.dataset.pick))}
function selectNode(id){if(!find(id))return;selected=id;$("reason").value="";$("reflection").value="";$("status").textContent="";history.replaceState(null,"",location.pathname+"?"+new URLSearchParams({concept:selected,lang}).toString());redraw()}
function redraw(){if(!atlas)return;document.documentElement.lang=lang;$("language").value=lang;let n=find(selected)||atlas.nodes[0];selected=n.id;
for(const [id,k]of Object.entries({heading:"heading",subtitle:"subtitle",filterLabel:"filter",searchLabel:"search",menuTitle:"menu",principle:"principle",connectionsTitle:"connections",pathTitle:"pathTitle",pathHint:"pathHint",pathTargetLabel:"pathTarget",findPath:"findPath",discoverTitle:"discover",discoverIntro:"discoverIntro",targetLabel:"target",relationLabel:"relation",reasonLabel:"reason",saveConnection:"save",reflectionTitle:"reflect",reflectionGuide:"reflectionGuide",reflectionLabel:"reflectionLabel",saveReflection:"saveReflection",backupsTitle:"backups",backupHint:"backupHint",export:"export",olderNetwork:"older"}))$(id).textContent=t()[k];
$("summary").textContent=atlas.nodes.length+" concepts · "+atlas.edges.length+" curated connections";
options();$("level").textContent=n.level==="university"?t().uni:t().hs;$("context").textContent=n[lang==="ja"?"contextJa":"contextEn"];$("name").textContent=nm(n);$("description").textContent=t().description;
$("chapterLink").hidden=!n.chapter;if(n.chapter){$("chapterLink").textContent=t().chapter;$("chapterLink").href="./high-school-chemistry"+(lang==="en"?"-en":"")+".html#chapter="+encodeURIComponent(n.chapter)}
$("olderNetwork").href="./concept-connections.html"+(lang==="en"?"?lang=en":"");
let links=atlas.edges.filter(e=>e.from===selected||e.to===selected).map(e=>({...e,other:e.from===selected?e.to:e.from,kind:"curated"}));
links.push(...notes.connections.filter(e=>e.from===selected||e.to===selected).map(e=>({...e,other:e.from===selected?e.to:e.from,kind:"personal",ja:e.reason,en:e.reason})));
$("connections").innerHTML=links.length?links.map(e=>{const target=find(e.other);if(!target)return "";return '<div class="connection"><span class="pill">'+safe(t().types[e.type]||e.type)+'</span> <span class="small">'+safe(e.kind==="curated"?t().curated:t().hypothesis)+'</span><h3>'+safe(nm(target))+'</h3><p>'+safe(e[lang])+'</p><button data-jump="'+safe(target.id)+'">'+safe(nm(target))+' →</button> '+(e.kind==="personal"?'<button data-remove-link="'+safe(e.id)+'">'+safe(t().delete)+'</button>':"")+'</div>'}).join(""):'<p>'+safe(t().noLinks)+'</p>';
$("target").innerHTML=atlas.nodes.filter(x=>x.id!==selected).map(x=>'<option value="'+safe(x.id)+'">'+safe(nm(x))+'</option>').join("");
$("pathTarget").innerHTML=atlas.nodes.filter(x=>x.id!==selected).map(x=>'<option value="'+safe(x.id)+'">'+safe(nm(x))+'</option>').join("");$("pathResult").innerHTML="";
$("relation").innerHTML=Object.entries(t().types).map(([k,v])=>'<option value="'+k+'">'+safe(v)+'</option>').join("");
$("reflections").innerHTML=notes.reflections.filter(x=>x.concept===selected).slice().reverse().map(x=>'<div class="note"><small>'+safe(x.at.slice(0,10))+'</small><p>'+safe(x.text)+'</p><button data-remove-note="'+safe(x.id)+'">'+safe(t().delete)+'</button></div>').join("");
nav();
document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>selectNode(b.dataset.jump));
document.querySelectorAll("[data-remove-link]").forEach(b=>b.onclick=()=>{notes.connections=notes.connections.filter(x=>x.id!==b.dataset.removeLink);persist();redraw()});
document.querySelectorAll("[data-remove-note]").forEach(b=>b.onclick=()=>{notes.reflections=notes.reflections.filter(x=>x.id!==b.dataset.removeNote);persist();redraw()});
}
$("filter").onchange=nav;$("search").oninput=nav;$("language").onchange=()=>{lang=$("language").value;redraw()};
$("saveConnection").onclick=()=>{const to=$("target").value,type=$("relation").value,reason=$("reason").value.trim();if(!find(to)||to===selected||!t().types[type]||!reason){$("status").textContent=t().need;return}notes.connections.push({id:"link-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),from:selected,to,type,reason,at:new Date().toISOString(),provenance:"learner-hypothesis"});notes.connections=notes.connections.slice(-500);try{persist();redraw();$("status").textContent=t().saved;$("reason").value=""}catch{$("status").textContent="Storage unavailable."}};
$("saveReflection").onclick=()=>{let text=$("reflection").value.trim();if(!text)return;notes.reflections.push({id:"reflection-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),concept:selected,text,at:new Date().toISOString(),provenance:"learner-reflection"});notes.reflections=notes.reflections.slice(-500);try{persist();redraw();$("status").textContent=t().saved;$("reflection").value=""}catch{$("status").textContent="Storage unavailable."}};

function shortestPath(from,to){
 const links=atlas.edges.concat(notes.connections).filter(e=>find(e.from)&&find(e.to));
 const seen=new Set([from]),queue=[[from]];
 for(let i=0;i<queue.length;i++){let path=queue[i],cur=path[path.length-1];if(cur===to)return path;
  for(let e of links){let neighbor=e.from===cur?e.to:e.to===cur?e.from:null;
   if(neighbor&&!seen.has(neighbor)){seen.add(neighbor);queue.push([...path,neighbor]);}}
 }return null;
}
$("findPath").onclick=()=>{
 const destination=$("pathTarget").value,route=shortestPath(selected,destination);
 if(destination===selected){$("pathResult").textContent=t().pathSame;return}
 if(!route){$("pathResult").textContent=t().pathEmpty;return}
 const all=atlas.edges.concat(notes.connections),parts=[];
 for(let i=0;i<route.length;i++){
  const n=find(route[i]);parts.push('<div class="connection"><strong>'+(i+1)+'. '+safe(nm(n))+'</strong>');
  if(i<route.length-1){const e=all.find(e=>(e.from===route[i]&&e.to===route[i+1])||(e.to===route[i]&&e.from===route[i+1]));
   const why=e.reason||e[lang]||"";parts.push('<p><span class="pill">'+safe(t().types[e.type]||e.type)+'</span> '+safe(why)+'</p>')}
  parts.push('</div>');
 }
 $("pathResult").innerHTML=parts.join("");
};

$("export").onclick=()=>{const data={schema:"chemistry-atlas-notes",schemaVersion:"1.0",sourceApp:"chemistry-structure-lab",exportedAt:new Date().toISOString(),payload:notes};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="chemistry-atlas-notes.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
fetch(DATA_URL).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{if(data.schema!=="chemistry-knowledge-atlas"||data.schemaVersion!=="1.0"||!Array.isArray(data.nodes)||!Array.isArray(data.edges))throw Error("invalid curriculum");atlas=data;if(!find(selected))selected=atlas.nodes[0].id;redraw()}).catch(()=>{$("nodes").textContent=t().loadError});
</script></body></html>
