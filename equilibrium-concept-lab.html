<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f4a"><title>化学平衡の知識ネットワーク | Chemistry Structure Lab</title><style>
:root{--deep:#174f4a;--line:#d6e7de;--soft:#eaf4ee}*{box-sizing:border-box}body{background:#f5f8f5;color:#253d35;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;line-height:1.8}header{background:var(--deep);color:#fff;padding:24px clamp(16px,5vw,60px)}header a{color:#dbf3e7}h1{font-size:clamp(22px,4vw,35px);margin:6px 0}main{max-width:1150px;margin:auto;padding:20px 15px 70px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:20px;margin:15px 0}.layout{display:grid;grid-template-columns:minmax(230px,310px) minmax(0,1fr);gap:16px}button,select,textarea{font:inherit;cursor:pointer;border-radius:11px;padding:10px;border:1px solid #b4d0c4}button{background:white;color:var(--deep)}button.active{background:var(--soft);font-weight:750}.node{display:block;width:100%;text-align:left;margin:5px 0}.link{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:14px;background:#fcfefd}.type{color:#176b59;background:var(--soft);padding:3px 11px;border-radius:40px;font-size:12px;font-weight:750}.link strong{display:block}a{color:#17675a}textarea{width:100%;min-height:110px;cursor:text;resize:vertical}select{max-width:100%}#entry{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.action{background:#176d61;color:#fff;border:0;padding:10px 16px}.small{font-size:13px;color:#5a7368}.takeaway{background:#f2f8f3;padding:15px;border-radius:12px;border-left:4px solid #489b7c}.insight{padding:12px;background:#f8fbf8;border:1px solid var(--line);border-radius:11px;margin:9px 0}.insight button{padding:4px 9px;font-size:12px}@media(max-width:720px){.layout{grid-template-columns:1fr}#list{display:grid;grid-template-columns:1fr 1fr;gap:5px}.node{font-size:13px}header{padding:18px}}</style></head><body><header><a href="./index.html">← Chemistry Structure Lab</a><h1 id="title"></h1><div id="lead"></div></header><main><div class="card"><div id="entry"><label for="lang">Language / 言語</label><select id="lang"><option value="ja">日本語</option><option value="en">English</option></select><a id="back" href="./concept-connections.html"></a></div><p class="small" id="guide"></p></div><div class="layout"><aside class="card"><h2 id="navTitle"></h2><div id="list"></div></aside><article><section class="card"><span class="type" id="nodeLabel"></span><h2 id="name"></h2><p id="description"></p><div class="takeaway" id="question"></div><p><a id="chapter" href="#"></a></p></section><section class="card"><h2 id="linksTitle"></h2><div id="links"></div></section><section class="card"><h2 id="reflectionTitle"></h2><p id="reflectionIntro"></p><label for="reflection" id="reflectionLabel"></label><textarea id="reflection" maxlength="1500"></textarea><button id="save" class="action"></button><div id="status" role="status"></div><div id="history"></div></section></article></div></main><script>
const NODES=[{"id":"rate","chapter":"2-1","ja":"反応速度","en":"Reaction rate","bodyJa":"反応がどれほど速く進むか。濃度・温度・触媒で変わり、正反応と逆反応を区別する。","bodyEn":"How rapidly reactions proceed. Concentration, temperature and catalysts may alter the forward and reverse rates.","questionJa":"反応が速いことと、生成物が多いことは同じだろうか。","questionEn":"Is a faster reaction necessarily one that produces more product?"},{"id":"reversible","chapter":"2-2","ja":"可逆反応","en":"Reversible reaction","bodyJa":"同じ条件で正方向と逆方向の反応が起こり得る。矢印は単に往復する粒子の絵ではなく、両方向の化学変化を表す。","bodyEn":"Forward and reverse reactions can occur under the same conditions; the two arrows represent both chemical transformations.","questionJa":"正反応が起こっているとき、逆反応は必ず止まっているだろうか。","questionEn":"Must the reverse reaction stop while the forward reaction occurs?"},{"id":"dynamic","chapter":"2-2","ja":"動的平衡","en":"Dynamic equilibrium","bodyJa":"閉じた系など適切な条件下で正反応速度と逆反応速度が等しい状態。両反応は継続し、巨視的な組成が一定になる。","bodyEn":"Under suitable conditions, such as a closed system, forward and reverse rates are equal. Both continue while macroscopic composition remains constant.","questionJa":"濃度が一定なら分子の反応も止まっているのだろうか。","questionEn":"Does constant concentration mean molecular reactions have stopped?"},{"id":"concentration","chapter":"1-3","ja":"濃度","en":"Concentration","bodyJa":"一定の体積に含まれる物質の量。反応速度や反応商を考える際に重要だが、活量と同一ではない。","bodyEn":"Amount of substance per solution volume. It matters for kinetics and reaction quotients, but differs from activity.","questionJa":"物質を足すと、必ず最終的な平衡組成の割合も同じだけ変わるか。","questionEn":"Does adding a substance change final equilibrium composition by the same proportion?"},{"id":"quotient","chapter":"2-2","ja":"反応商 Q","en":"Reaction quotient Q","bodyJa":"任意の時点の組成を、反応式に応じた活量の積の比で表す。希薄な理想系では濃度で近似することがある。","bodyEn":"A ratio of activities at any instant, with exponents from stoichiometry. Concentrations can approximate activities in ideal dilute systems.","questionJa":"QとKを比べれば、どちらの方向へ変化するかを予測できるのはなぜか。","questionEn":"Why can comparing Q and K predict the direction of change?"},{"id":"constant","chapter":"2-2","ja":"平衡定数 K","en":"Equilibrium constant K","bodyJa":"一定温度で平衡状態の反応商が取る値（活量基準）。平衡定数は温度に依存し、触媒だけでは変わらない。","bodyEn":"The activity-based reaction quotient at equilibrium at a fixed temperature. Catalysts do not change K.","questionJa":"触媒で平衡到達時間が短縮してもKが変わらないのはなぜか。","questionEn":"Why can a catalyst shorten time to equilibrium without changing K?"},{"id":"shift","chapter":"2-2","ja":"平衡の移動","en":"Equilibrium shift","bodyJa":"条件を変更すると、新しい平衡へ向けて正味の反応が進む。ルシャトリエの原理は予測の手がかりだが、定量的にはQとKを比較する。","bodyEn":"A disturbance can drive net reaction toward a new equilibrium. Le Châtelier's principle is a heuristic; Q versus K gives a more precise basis.","questionJa":"濃度を変えた直後、正逆速度はどちらも同じ割合で変わるだろうか。","questionEn":"Immediately after changing concentration, do both rates change by the same factor?"},{"id":"acid","chapter":"2-3","ja":"弱酸の電離平衡","en":"Weak-acid dissociation","bodyJa":"弱酸 HA が水中で HA + H₂O ⇌ H₃O⁺ + A⁻ のように電離する平衡。酸解離定数Kaが平衡の程度を特徴づける。","bodyEn":"Weak acid HA undergoes HA + H₂O ⇌ H₃O⁺ + A⁻ in water. The acid dissociation constant Ka characterizes this equilibrium.","questionJa":"共役塩基A⁻を加えると弱酸の電離はどうなるか。","questionEn":"What happens to weak-acid dissociation when conjugate base A⁻ is added?"},{"id":"buffer","chapter":"2-4","ja":"緩衝作用","en":"Buffer action","bodyJa":"弱酸と共役塩基などの組み合わせが少量の酸・塩基添加によるpH変化を抑える。容量には限りがある。","bodyEn":"A weak acid and its conjugate base can resist pH changes from small additions of acid or base, within a finite capacity.","questionJa":"緩衝液なら酸を無限に加えてもpHは変わらないのだろうか。","questionEn":"Can a buffer keep pH unchanged regardless of how much acid is added?"},{"id":"gibbs","chapter":"2-0","ja":"ギブズエネルギー","en":"Gibbs energy","bodyJa":"一定温度・圧力での反応の進みやすさを扱う熱力学量。ΔrG = ΔrG° + RT ln Q、平衡ではΔrG = 0（適切な条件下）。","bodyEn":"At constant temperature and pressure, reaction Gibbs energy relates to net reaction tendency: ΔrG = ΔrG° + RT ln Q; at equilibrium ΔrG = 0 under suitable conditions.","questionJa":"発熱反応なら必ず生成物側に大きく偏るといえるだろうか。","questionEn":"Must an exothermic reaction always strongly favor products?"}];
const EDGES=[["rate","dynamic","prerequisite","平衡は反応が止まることではなく、正逆の速度が等しいこと。","Equilibrium is equality of forward and reverse rates, not cessation."],["reversible","dynamic","prerequisite","両方向に反応が進むことから動的平衡が理解できる。","Reversibility is needed to understand dynamic equilibrium."],["concentration","quotient","prerequisite","濃度の知識を活量によるQの理解へ広げる。","Extend concentration knowledge to activity-based Q."],["quotient","constant","contrast","Qは任意の時点、Kは平衡時の値。","Q describes any instant; K is its equilibrium value."],["constant","shift","application","条件変更直後のQとKの比較から正味の反応方向がわかる。","Comparing Q with K after a disturbance predicts net direction."],["rate","constant","contrast","速度を速める触媒は、同温度のKを変えない。","Catalysts alter rates, not K at the same temperature."],["dynamic","acid","application","弱酸の電離も正逆反応の続く動的平衡として読める。","Weak-acid dissociation is itself dynamic equilibrium."],["acid","buffer","application","弱酸と共役塩基の平衡を使うと緩衝作用が説明できる。","Acid-base equilibrium explains buffer action."],["gibbs","constant","reinterpret","平衡定数は単なる暗記式でなく ΔrG° = −RT ln K と結びつく。","K is linked to standard reaction Gibbs energy by ΔrG° = −RT ln K."],["gibbs","shift","reinterpret","ルシャトリエの原理から反応商と自由エネルギーの定量的な議論へ進める。","Move from Le Châtelier's heuristic to Q and Gibbs energy."],["concentration","rate","contrast","速度式の濃度依存と平衡組成の濃度依存を混同しない。","Do not confuse concentration dependence of rates with equilibrium composition."]];
const TYPES={ja:{prerequisite:"前提",contrast:"対照",application:"応用",reinterpret:"再解釈"},en:{prerequisite:"Prerequisite",contrast:"Contrast",application:"Application",reinterpret:"Reinterpretation"}};
const TXT={ja:{title:"化学平衡をつなぎ直す",lead:"10個の概念を行き来し、以前の理解がどう変わるかを探る",guide:"順序も正答も求めません。未理解のまま進み、あとから戻ってかまいません。下の問いは考える入口であり、回答義務はありません。",nav:"概念を自由に選ぶ",label:"知識のネットワーク",chapter:"対応する高校化学の章へ ↗",links:"ほかの知識との関係",reflection:"理解の熟成メモ",reflectionIntro:"別の単元を学んだあと、この概念が違って見えたら記録しましょう。書かなくても学習できます。",reflectionLabel:"以前との違い／新しく気づいたこと",save:"気づきを保存",history:"以前の気づき",empty:"まだ記録はありません。",saved:"この端末に保存しました。",deleted:"削除しました。",delete:"削除",back:"29章の知識ネットワークへ",question:"問い",again:"この概念をもう一度見る",noLinks:"関連の登録はまだありません。"},en:{title:"Revisit Chemical Equilibrium",lead:"Connect ten concepts and notice how new knowledge changes old ideas",guide:"No required order, no mastery gate. Continue with partial understanding and return later. Prompts are optional invitations to think.",nav:"Choose any concept",label:"Concept network",chapter:"Open the high-school chapter ↗",links:"Connections to other ideas",reflection:"Notes on evolving understanding",reflectionIntro:"When new topics change how this idea looks, record the change. Notes are optional.",reflectionLabel:"What appears different now?",save:"Save insight",history:"Previous insights",empty:"No insights saved yet.",saved:"Saved on this device.",deleted:"Removed.",delete:"Delete",back:"Back to the 29-chapter network",question:"Consider",again:"Revisit this idea",noLinks:"No curated links yet."}};
let lang=new URLSearchParams(location.search).get("lang")==="en"?"en":"ja",selected=new URLSearchParams(location.search).get("concept");if(!NODES.some(n=>n.id===selected))selected="dynamic";const $=id=>document.getElementById(id);const key="chemistry-fine-concept-insights-v1";let insights=[];try{const data=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(data))insights=data.filter(x=>x&&typeof x==="object"&&NODES.some(n=>n.id===x.concept)&&typeof x.note==="string").slice(-500)}catch{}function esc(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function persist(){try{localStorage.setItem(key,JSON.stringify(insights))}catch{$("status").textContent=lang==="ja"?"保存できませんでした。容量をご確認ください。":"Could not save. Check device storage."}}
function linkTo(id){return NODES.find(n=>n.id===id)}function show(){const t=TXT[lang],node=linkTo(selected);document.documentElement.lang=lang;$("lang").value=lang;for(const [id,k]of Object.entries({title:"title",lead:"lead",guide:"guide",navTitle:"nav",nodeLabel:"label",linksTitle:"links",reflectionTitle:"reflection",reflectionIntro:"reflectionIntro",reflectionLabel:"reflectionLabel",save:"save",back:"back",chapter:"chapter"}))$(id).textContent=t[k];$("back").href="./concept-connections.html"+(lang==="en"?"?lang=en":"");$("name").textContent=node[lang];$("description").textContent=node[lang==="ja"?"bodyJa":"bodyEn"];$("question").textContent=t.question+"： "+node[lang==="ja"?"questionJa":"questionEn"];$("chapter").href="./high-school-chemistry"+(lang==="en"?"-en":"")+".html#chapter="+encodeURIComponent(node.chapter);
$("list").innerHTML=NODES.map(n=>'<button class="node '+(n.id===selected?'active':'')+'" data-node="'+n.id+'">'+esc(n[lang])+'</button>').join("");const related=EDGES.filter(e=>e[0]===selected||e[1]===selected);$("links").innerHTML=related.length?related.map(e=>{const other=e[0]===selected?e[1]:e[0],target=linkTo(other);return '<div class="link"><span class="type">'+esc(TYPES[lang][e[2]])+'</span><strong>'+esc(target[lang])+'</strong><p>'+esc(e[lang==="ja"?3:4])+'</p><button data-node="'+other+'">'+esc(t.again)+' →</button></div>'}).join(""):t.noLinks;const history=insights.filter(x=>x.concept===selected).slice().reverse();$("history").innerHTML='<h3>'+t.history+'</h3>'+(history.length?history.map(n=>'<div class="insight"><p>'+esc(n.note)+'</p><small>'+esc(n.createdAt.slice(0,10))+'</small> <button data-remove="'+esc(n.id)+'">'+esc(t.delete)+'</button></div>').join(""):'<p class="small">'+t.empty+'</p>');document.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{selected=b.dataset.node;$("reflection").value="";$("status").textContent="";location.hash="concept="+selected;show()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{insights=insights.filter(n=>n.id!==b.dataset.remove);persist();$("status").textContent=t.deleted;show()})}
$("lang").onchange=()=>{lang=$("lang").value;show()};$("save").onclick=()=>{const note=$("reflection").value.trim();if(!note)return;insights.push({id:"n-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),concept:selected,note,createdAt:new Date().toISOString(),provenance:"learner-reflection"});insights=insights.slice(-500);persist();$("reflection").value="";show();$("status").textContent=TXT[lang].saved};const hash=location.hash.match(/^#concept=([a-z-]+)$/);if(hash&&linkTo(hash[1]))selected=hash[1];show();
</script></body></html>
