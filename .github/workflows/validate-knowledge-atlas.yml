name: Validate Chemistry Knowledge Atlas
on:
  push:
    branches: [main]
    paths:
      - 'data/chemistry-knowledge-atlas-v1.json'
      - 'tests/validate-atlas.mjs'
      - 'tests/validate-depth.mjs'
      - 'data/chemistry-depth-*.json'
      - 'data/chemistry-depth-extensions-v1.json'
      - 'data/chemistry-knowledge-bridges-v1.json'
      - 'data/chemistry-teaching-approaches-v1.json'
      - 'state-function-lab.html'
      - 'chemistry-depth-viewer.js'
      - 'chemistry-topic-visuals.js'
      - 'high-school-chemistry*.html'
      - 'sw.js'
      - 'learning-interchange.html'
      - 'tests/validate-equilibrium.mjs'
      - 'equilibrium-experiment.html'
      - '.github/workflows/validate-knowledge-atlas.yml'
  pull_request:
    paths:
      - 'data/chemistry-knowledge-atlas-v1.json'
      - 'tests/validate-atlas.mjs'
      - 'tests/validate-depth.mjs'
      - 'data/chemistry-depth-*.json'
      - 'data/chemistry-depth-extensions-v1.json'
      - 'data/chemistry-knowledge-bridges-v1.json'
      - 'data/chemistry-teaching-approaches-v1.json'
      - 'state-function-lab.html'
      - 'chemistry-depth-viewer.js'
      - 'chemistry-topic-visuals.js'
      - 'high-school-chemistry*.html'
      - 'sw.js'
      - 'learning-interchange.html'
      - '.github/workflows/validate-knowledge-atlas.yml'
permissions:
  contents: read
jobs:
  validate-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bilingual concept graph and chapter coverage
        run: |
          node tests/validate-atlas.mjs
          node tests/validate-equilibrium.mjs
          node tests/validate-depth.mjs
