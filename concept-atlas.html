<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f4a"><title>Concept Atlas | Chemistry Structure Lab</title><style>
:root{--ink:#174f4a;--line:#d9e6df;--soft:#edf6f1}*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#273f38;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.7}header{background:var(--ink);color:#fff;padding:20px clamp(16px,4vw,48px)}header a{color:#def4e8}main{max-width:1120px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.cols{display:grid;grid-template-columns:280px minmax(0,1fr);gap:15px}button,input,select,textarea{font:inherit;border:1px solid #b3cec1;border-radius:10px;padding:9px}button{cursor:pointer;background:#fff;color:var(--ink)}button.active{background:#daf0e5;font-weight:700}button.primary{background:#176e61;color:#fff}button.node{display:block;width:100%;text-align:left;margin:4px 0}input,textarea{width:100%}textarea{min-height:80px;resize:vertical}.relation{border:1px solid var(--line);border-radius:11px;padding:12px;margin:9px 0}.type{font-size:12px;background:var(--soft);color:#176e61;border-radius:20px;padding:3px 9px}.muted{color:#5a7569;font-size:13px}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px}h1{margin:5px 0;font-size:clamp(24px,4vw,34px)}h2,h3{color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}a{color:#126556}#nodes{max-height:580px;overflow:auto}#feedback{min-height:1.5em}@media(max-width:730px){.cols,.grid{grid-template-columns:1fr}#nodes{max-height:280px}}</style></head><body>
<header><a href="./index.html">← Chemistry Structure Lab</a><h1 id="heading">Concept Atlas</h1><div id="subtitle"></div></header><main><div class="card tools"><label for="lang">Language</label><select id="lang"><option value="ja">日本語</option><option value="en">English</option></select><a href="./concept-connections.html" id="back">29章の知識ネットワーク</a></div>

<script>
"use strict";
const NODES=[["atom","原子番号","Atomic number","原子の陽子数が元素を決める。","The proton count determines the element.","0-1"],["isotope","同位体","Isotopes","陽子数は同じで中性子数が違う。","Same proton count, differing neutron counts.","0-1"],["shell","電子配置","Electron configuration","電子は許された量子状態を占有する。","Electrons occupy allowed quantum states.","0-2"],["valence","価電子","Valence electrons","最外殻付近の電子状態は化学反応性を考える手掛かり。","Outer-shell electronic states inform reactivity.","0-2"],["polarity","結合の極性","Bond polarity","結合内の電荷分布の偏り。","Unequal distribution of charge within a bond.","0-3"],["geometry","分子の形","Molecular geometry","分子の立体的配置は結合双極子の合成に影響する。","Three-dimensional arrangement affects how bond dipoles add.","0-4"],["intermol","分子間力","Intermolecular forces","分散力・双極子相互作用・水素結合など。","Dispersion, dipolar interactions and hydrogen bonding.","0-4"],["mole","物質量","Amount of substance","1 molは正確に6.02214076×10²³個の指定粒子を含む。","One mole contains exactly 6.02214076×10²³ specified entities.","1-0"],["molar","モル質量","Molar mass","1 molあたりの質量を表す。","Mass per mole of specified substance.","1-0"],["stoich","反応係数","Stoichiometric coefficients","反応式の係数は粒子数および物質量の比。","Coefficients give particle-count and mole ratios.","1-1"],["limiting","制限試薬","Limiting reagent","どの反応物が理論生成量を制限するか。","The reactant limiting maximum theoretical product.","1-1"],["concentration","モル濃度","Molar concentration","溶液体積あたりの溶質の物質量。","Solute amount per solution volume.","1-3"],["gas","理想気体","Ideal gas","PV=nRTが成り立つ理想化された気体モデル。","An idealized gas obeying PV=nRT.","1-2"],["rate","反応速度","Reaction rate","組成が時間とともに変わる速さ。","How fast composition changes over time.","2-1"],["reversible","可逆反応","Reversible reaction","正方向と逆方向の化学反応が可能。","Both forward and reverse transformations are possible.","2-2"],["dynamic","動的平衡","Dynamic equilibrium","正逆の反応速度が等しく、巨視的組成が一定。","Equal forward and reverse rates; stable macroscopic composition.","2-2"],["quotient","反応商","Reaction quotient","任意時点の組成に対応する活量の比Q。","Activity-based ratio Q for a composition at any instant.","2-2"],["constant","平衡定数","Equilibrium constant","一定温度の平衡状態におけるQの値K。","Value K of Q at equilibrium at fixed temperature.","2-2"],["gibbs","反応ギブズエネルギー","Reaction Gibbs energy","一定温度・圧力で正味の反応方向と関係する。","Relates to net reaction tendency at fixed T and P.","2-0"],["acid","酸解離平衡","Acid dissociation equilibrium","弱酸の電離を可逆反応・平衡として捉える。","Weak-acid ionization as a reversible equilibrium.","2-3"],["buffer","緩衝作用","Buffer action","共役酸塩基対が少量の添加に伴うpH変化を抑える。","A conjugate pair resists pH change from modest additions.","2-4"],["ester","エステル化","Esterification","カルボン酸とアルコールが可逆的に反応する例。","A reversible reaction of carboxylic acid and alcohol.","4-3"]],EDGES=[["atom","isotope","contrast","元素の同一性は陽子数で決まり、中性子数の違いは同位体を生む。","Element identity depends on protons; neutron variation produces isotopes."],["atom","shell","prerequisite","中性原子の電子数は原子番号と等しく、電子配置の出発点になる。","A neutral atom has as many electrons as protons, setting up configuration."],["shell","valence","application","電子配置から価電子の特徴と周期的な傾向を読み取れる。","Configuration helps reveal valence patterns and periodic trends."],["valence","polarity","application","結合する原子の電子的性質の差が電荷分布の偏りに結びつく。","Differences between bonded atoms influence electron distribution."],["polarity","geometry","reinterpret","結合が極性でも、対称な分子全体の双極子は打ち消され得る。","Polar bonds can cancel in a symmetric molecule."],["geometry","intermol","application","分子の極性と形が分子間の相互作用を左右する。","Molecular shape and polarity influence intermolecular interactions."],["mole","molar","prerequisite","物質量とモル質量を組み合わせて質量を扱う。","Amount and molar mass together connect to measurable mass."],["mole","stoich","application","反応係数を物質量の比として使える。","Stoichiometric coefficients are also mole ratios."],["stoich","limiting","application","係数比と各反応物の物質量を比較して制限試薬を決める。","Compare available amounts against coefficients to identify the limiting reagent."],["mole","concentration","application","溶液体積がわかれば物質量を濃度として表せる。","Amount divided by solution volume gives molarity."],["mole","gas","application","気体の物質量をPV=nRTによって圧力・体積・温度とつなぐ。","PV=nRT connects gas amount to pressure, volume and temperature."],["concentration","rate","analogy","濃度は速度式に現れるが、反応次数は実験から確かめる必要がある。","Concentration appears in rate laws, but orders must be established experimentally."],["rate","dynamic","reinterpret","平衡は反応が停止した状態ではなく正逆の速度が等しい状態。","Equilibrium is equality of rates, not the end of molecular reactions."],["reversible","dynamic","prerequisite","逆方向の反応も続くため動的平衡が可能になる。","Ongoing reverse reaction makes dynamic equilibrium possible."],["concentration","quotient","prerequisite","希薄な理想系では活量を濃度で近似して反応商を考えられる。","Activities can sometimes be approximated with concentrations in ideal dilute systems."],["quotient","constant","contrast","Qは任意時点の値、Kは一定温度で平衡にあるときの値。","Q applies at any instant; K is its equilibrium value at fixed temperature."],["constant","gibbs","reinterpret","ΔrG° = −RT ln K によって平衡定数の熱力学的意味が見える。","ΔrG° = −RT ln K gives equilibrium constants thermodynamic meaning."],["dynamic","acid","application","弱酸の電離も正逆反応の続く平衡として理解できる。","Weak-acid dissociation is an example of dynamic equilibrium."],["acid","buffer","application","共役酸塩基対の平衡が緩衝作用を支える。","Conjugate acid-base equilibrium underlies buffering."],["reversible","ester","application","エステル化も生成物側だけを考えると不十分な可逆反応。","Esterification is reversible, not simply a one-way product formation."],["gibbs","rate","contrast","熱力学的に有利でも反応が速いとは限らない。","Thermodynamic favorability does not imply fast kinetics."],["intermol","gas","contrast","理想気体モデルは分子間力を無視するが実在気体では影響がある。","Ideal gases neglect intermolecular attractions that matter for real gases."]],KEY="chemistry-atlas-discoveries-v1";
const T={ja:{heading:"知識のアトラス",subtitle:"原子・物質量・化学平衡を自由に行き来して、知識の意味を更新する",back:"29章の知識ネットワーク",search:"概念を検索",curated:"教材が示すつながり",mine:"自分で見つけたつながり",add:"つながりを記録",to:"相手の概念",kind:"関係の種類",reason:"なぜそう考えたか（仮説でも可）",save:"発見を保存",export:"発見をJSONで書き出す",hint:"個人の発見は端末内に保存され、教材の確立した関係とは区別されます。自動同期はありません。",lesson:"関連する高校化学の章を開く",policy:"この概念を完全に理解していなくても、自由に別の概念へ進めます。",empty:"まだ発見がありません。",delete:"削除",saved:"保存しました。",error:"異なる概念と理由を指定してください。",types:["前提","類似","対照","応用","再解釈"]},en:{heading:"Concept Atlas",subtitle:"Revisit atomic structure, amount of substance, and equilibrium without prescribed order",back:"29-chapter connections",search:"Search concepts",curated:"Curated connections",mine:"Connections you discovered",add:"Add a connection",to:"Connect to",kind:"Relationship",reason:"Why do you see this connection? Hypotheses welcome.",save:"Save discovery",export:"Export discoveries as JSON",hint:"Personal hypotheses stay on this device and remain separate from curated links. No automatic synchronization.",lesson:"Open related high-school chapter",policy:"You can explore other concepts without having mastered this one.",empty:"No discoveries yet.",delete:"Delete",saved:"Saved.",error:"Choose a different concept and enter a reason.",types:["Prerequisite","Analogy","Contrast","Application","Reinterpretation"]}};
const TYPES=["prerequisite","analogy","contrast","application","reinterpret"];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const allIds=NODES.map(x=>x[0]);const url=new URLSearchParams(location.search);let lang=url.get("lang")==="en"?"en":"ja",current=allIds.includes(url.get("concept"))?url.get("concept"):"dynamic";
let notes=[];try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(x))notes=x.filter(n=>n&&allIds.includes(n.from)&&allIds.includes(n.to)&&n.from!==n.to&&TYPES.includes(n.kind)&&typeof n.reason==="string"&&n.reason.length<=1200).slice(-300)}catch{}
const find=id=>NODES.find(n=>n[0]===id);const name=id=>find(id)?.[lang==="ja"?1:2]||id;const kind=k=>T[lang].types[TYPES.indexOf(k)]||k;
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch{$("feedback").textContent=lang==="ja"?"保存に失敗しました。":"Storage failed.";return false}}
function render(){const t=T[lang];document.documentElement.lang=lang;$("lang").value=lang;for(const [id,key] of Object.entries({heading:"heading",subtitle:"subtitle",back:"back",searchLabel:"search",curatedTitle:"curated",myTitle:"mine",addTitle:"add",toLabel:"to",kindLabel:"kind",reasonLabel:"reason",add:"save",export:"export",exportHint:"hint",lesson:"lesson",policy:"policy"}))$(id).textContent=t[key];$("back").href="./concept-connections.html"+(lang==="en"?"?lang=en":"");const n=find(current);$("conceptName").textContent=name(current);$("definition").textContent=n[lang==="ja"?3:4];$("category").textContent=n[5].startsWith("0-")?"Atomic structure":n[5].startsWith("1-")?"Matter & quantities":"Reactions & equilibrium";$("lesson").href="./high-school-chemistry"+(lang==="en"?"-en":"")+".html#chapter="+n[5];const filter=$("filter").value.toLowerCase();$("nodes").innerHTML=NODES.filter(n=>n[1].toLowerCase().includes(filter)||n[2].toLowerCase().includes(filter)).map(n=>'<button class="node '+(n[0]===current?"active":"")+'" data-node="'+n[0]+'">'+esc(n[lang==="ja"?1:2])+"</button>").join("");$("to").innerHTML=allIds.filter(x=>x!==current).map(x=>'<option value="'+x+'">'+esc(name(x))+"</option>").join("");$("kind").innerHTML=TYPES.map(x=>'<option value="'+x+'">'+esc(kind(x))+"</option>").join("");
const edges=EDGES.filter(e=>e[0]===current||e[1]===current);$("curated").innerHTML=edges.map(e=>{const to=e[0]===current?e[1]:e[0];return '<div class="relation"><span class="type">'+esc(kind(e[2]))+'</span><h3>'+esc(name(to))+'</h3><p>'+esc(e[lang==="ja"?3:4])+'</p><button data-node="'+to+'">'+esc(name(to))+' ↗</button></div>'}).join("");
const mine=notes.filter(n=>n.from===current||n.to===current);$("mine").innerHTML=mine.length?mine.map(n=>'<div class="relation"><span class="type">'+esc(kind(n.kind))+'</span><strong> '+esc(name(n.from===current?n.to:n.from))+'</strong><p>'+esc(n.reason)+'</p><button data-delete="'+esc(n.id)+'">'+t.delete+'</button></div>').join(""):'<p class="muted">'+t.empty+"</p>";
document.querySelectorAll("[data-node]").forEach(b=>b.onclick=()=>{current=b.dataset.node;history.replaceState(null,"","?"+new URLSearchParams({lang,concept:current}));$("feedback").textContent="";render()});
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{notes=notes.filter(n=>n.id!==b.dataset.delete);if(save())render()});}
$("filter").oninput=render;$("lang").onchange=()=>{lang=$("lang").value;history.replaceState(null,"","?"+new URLSearchParams({lang,concept:current}));render()};
$("add").onclick=()=>{const to=$("to").value,reason=$("reason").value.trim(),kind=$("kind").value;if(!allIds.includes(to)||to===current||!reason||!TYPES.includes(kind)){$("feedback").textContent=T[lang].error;return}const rec={id:"a-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),from:current,to,kind,reason,createdAt:new Date().toISOString(),provenance:"learner-hypothesis"};notes.push(rec);notes=notes.slice(-300);if(save()){$("reason").value="";render();$("feedback").textContent=T[lang].saved}};
$("export").onclick=()=>{const data={schema:"chemistry-concept-atlas",schemaVersion:"1.0",sourceApp:"chemistry-structure-lab",exportedAt:new Date().toISOString(),records:notes};const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="chemistry-atlas-discoveries.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></body></html>
